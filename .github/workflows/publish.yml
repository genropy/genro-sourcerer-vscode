name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --out genro-sourcerer-vscode-${{ github.ref_name }}.vsix

      - name: Create GitHub Release with VSIX asset
        uses: softprops/action-gh-release@v2
        with:
          name: Sourcerer Visual ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: genro-sourcerer-vscode-${{ github.ref_name }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
